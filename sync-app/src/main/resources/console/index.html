<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RivoMesh</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
  <script src="/configuration-editor.js" defer></script>
  <script src="/audit.js" defer></script>
  <script src="/accounts.js" defer></script>
  <script src="/validation.js" defer></script>
  <script src="/recovery.js" defer></script>
  <script src="/handoff.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content" data-i18n="skipToContent"></a>
<aside class="sidebar">
  <div class="brand-row">
    <a class="brand" href="/" aria-label="RivoMesh">
      <img class="brand-day" src="/brand/wordmark.svg" width="304" height="64" alt="">
      <img class="brand-night" src="/brand/wordmark-light.svg" width="304" height="64" alt="">
    </a>
    <button id="theme-toggle" class="theme-toggle quiet hidden" type="button" aria-pressed="false">
      <span class="theme-day" aria-hidden="true">☾</span><span class="theme-night" aria-hidden="true">☀</span>
      <span class="sr-only" data-i18n="darkTheme"></span>
    </button>
  </div>
  <nav class="workspace-nav" aria-label="RivoMesh">
    <button class="nav active" id="tasks-nav" type="button" aria-current="page" data-i18n="tasks"></button>
    <button class="nav" id="nodes-nav" type="button" data-i18n="nodes" disabled></button>
    <button class="nav" id="adapters-nav" type="button" data-i18n="adapters"></button>
    <button class="nav" id="accounts-nav" type="button" aria-haspopup="dialog" data-i18n="accountsTitle" disabled></button>
    <button class="nav" id="audit-nav" type="button" aria-haspopup="dialog" data-audit-i18n="auditTitle" disabled></button>
  </nav>
  <div class="sidebar-foot"><span class="dot"></span><span data-i18n="localControl"></span></div>
</aside>
<main id="main-content" tabindex="-1">
<header class="workspace-header">
  <div>
    <h1 id="page-title" data-i18n="tasks"></h1>
    <p id="session-info" class="subtle"></p>
  </div>
  <div class="header-actions">
    <button id="language" class="quiet" type="button">English</button>
    <button id="logout" class="quiet" type="button" data-i18n="logout"></button>
    <input id="import-file" class="hidden" type="file" accept=".yml,.yaml,.json">
    <button id="import-task" type="button" data-i18n="importTask"></button>
    <button id="new-task" class="primary" type="button" data-i18n="newTask"></button>
  </div>
</header>
<div id="notice" class="notice hidden" role="status"></div>
<section id="task-owner-control" class="panel hidden"><label><span data-i18n="ownerNode"></span><input id="task-owner" list="owner-options" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" autocomplete="off" disabled></label><datalist id="owner-options"></datalist><label class="placement-option"><input id="task-auto-placement" type="checkbox" disabled><span data-i18n="automaticPlacement"></span></label><p class="subtle" data-i18n="ownerHelp"></p><button id="owners-reload" type="button" data-i18n="nodesReload"></button><button id="owners-more" type="button" class="hidden" data-i18n="nodesNext"></button></section>
<section id="tasks-view"><div class="metrics"><article><span data-i18n="totalTasks"></span><strong id="total-count">0</strong></article><article><span data-i18n="running"></span><strong id="running-count">0</strong></article><article><span data-i18n="attention"></span><strong id="attention-count">0</strong></article><article><span data-i18n="pendingTransactions"></span><strong id="pending-count">0</strong></article></div>
<div class="workspace-grid"><section class="panel task-panel"><div class="panel-heading"><h2 data-i18n="pipelines"></h2><span class="live-label" data-i18n="refresh"></span></div><form id="task-filter" class="task-filter hidden">
<div class="form-grid"><label><span data-i18n="filterTaskId"></span><input name="taskId" maxlength="128" autocomplete="off" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,127}"></label>
<label><span data-i18n="filterOwner"></span><input name="ownerNodeId" list="owner-options" maxlength="64" autocomplete="off" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}"></label></div>
<div class="task-page-actions"><button type="submit" data-i18n="applyTaskFilter"></button><button id="clear-task-filter" type="button" data-i18n="clearTaskFilter"></button></div>
</form><div id="task-list"></div><div id="task-pagination" class="hidden"><p id="task-page-status" class="subtle" role="status"></p><div class="task-page-actions"><button id="tasks-first" type="button" data-i18n="tasksFirst"></button><button id="tasks-previous" type="button" data-i18n="previous"></button><button id="tasks-next" type="button" data-i18n="tasksNext"></button></div></div></section><section class="panel detail-panel"><div id="task-detail"></div></section></div><section id="invalid-configs" class="panel hidden"></section></section>
<section id="adapters-view" class="panel hidden"><div class="panel-heading"><h2 data-i18n="adapters"></h2></div><p class="subtle" data-i18n="adapterHelp"></p><div id="adapter-list" class="adapter-grid"></div></section>
<section id="nodes-view" class="panel hidden"><div class="panel-heading"><h2 data-i18n="nodes"></h2><button id="nodes-reload" type="button" data-i18n="nodesReload"></button></div><p class="subtle" data-i18n="nodesHelp"></p><p id="nodes-state" class="callout" role="status"></p><p id="nodes-error" class="error" role="alert"></p><div id="nodes-list" class="node-grid"></div><button id="nodes-next" type="button" class="hidden" data-i18n="nodesNext"></button></section>
<footer><span id="last-refresh"></span></footer></main>
<dialog id="login-dialog" aria-labelledby="login-title" aria-describedby="login-help">
  <form id="login-form">
    <div class="brand login-brand" aria-hidden="true">
      <img class="brand-day" src="/brand/wordmark.svg" width="304" height="64" alt="">
      <img class="brand-night" src="/brand/wordmark-light.svg" width="304" height="64" alt="">
    </div>
    <h2 id="login-title" data-i18n="loginTitle"></h2>
    <p id="login-help" class="subtle" data-i18n="loginHelp"></p>
    <label><span data-i18n="accessToken"></span><input id="token" type="password" autocomplete="off" required minlength="24" autofocus></label>
    <p id="login-error" class="error" role="alert"></p>
    <button class="primary" type="submit" data-i18n="connect"></button>
    <a id="login-oidc" class="hidden" href="/auth/oidc/start" data-i18n="loginOidc"></a>
  </form>
</dialog>
<dialog id="create-dialog"><form id="create-form" novalidate><div class="dialog-heading"><div><h2 data-i18n="createTitle"></h2></div><button type="button" id="close-create" class="quiet" aria-label="Close">×</button></div><div class="steps"><span id="step-label-0"></span><span id="step-label-1"></span><span id="step-label-2"></span></div>
<section class="form-step" id="step-0"><label id="create-owner-row" class="hidden"><span data-i18n="ownerNode"></span><input id="create-owner" name="ownerNodeId" list="owner-options" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" autocomplete="off" disabled></label><label id="create-placement-row" class="placement-option hidden"><input id="create-auto-placement" type="checkbox" disabled><span data-i18n="automaticPlacement"></span></label><label><span data-i18n="runtime"></span><select name="formatVersion"><option value="3">V3 · Multi-database / fan-out</option><option value="2">V2 · Legacy single target</option></select></label><label class="v3-field"><span data-i18n="sourceEngine"></span><select name="sourceType"><option value="MYSQL">MySQL</option><option value="POSTGRESQL">PostgreSQL</option><option value="ORACLE">Oracle</option></select></label><div class="form-grid"><label><span data-i18n="taskId"></span><input name="jobId" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,127}" placeholder="sales-migration"></label><label><span data-i18n="sourceCluster"></span><input name="clusterId" required maxlength="128" placeholder="sales-source"></label><label data-wizard-source="MYSQL"><span data-i18n="sourceHost"></span><input name="sourceHost" required value="127.0.0.1"></label><label data-wizard-source="MYSQL"><span data-i18n="sourceExpectedVersion"></span><input name="sourceExpectedVersion" pattern="[1-9][0-9]{0,2}[.](0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,3}))?" placeholder="8.4"></label><label data-wizard-source="MYSQL"><span data-i18n="port"></span><input name="sourcePort" type="number" required min="1" max="65535" value="3306"></label><label data-wizard-source="MYSQL"><span data-i18n="sourceDatabase"></span><input name="sourceDatabase" required placeholder="business"></label><label data-wizard-source="MYSQL"><span data-i18n="replicationId"></span><input name="serverId" type="number" required min="1" max="4294967295" value="910001"></label><label data-wizard-source="MYSQL"><span data-i18n="username"></span><input name="sourceUsername" required autocomplete="off"></label><label data-wizard-source="MYSQL"><span data-i18n="password"></span><input name="sourcePassword" type="password" autocomplete="new-password"></label></div><div class="form-grid hidden" data-wizard-source="POSTGRESQL">
<label><span data-i18n="sourceJdbc"></span><input name="pgUrl" required disabled placeholder="jdbc:postgresql://source:5432/business"></label>
<label><span data-i18n="pgDatabase"></span><input name="pgDatabase" required disabled placeholder="business"></label>
<label><span data-i18n="pgSchemas"></span><input name="pgSchemas" required disabled placeholder="sales, billing"></label>
<label><span data-i18n="sourceExpectedVersion"></span><input name="pgVersion" disabled pattern="(17|18)([.][0-9]{1,3})?" placeholder="17.12"></label>
<label><span data-i18n="username"></span><input name="pgUsername" required disabled autocomplete="off"></label>
<label><span data-i18n="password"></span><input name="pgPassword" type="password" disabled autocomplete="new-password"></label>
<label><span data-i18n="pgPublication"></span><input name="pgPublication" required disabled pattern="[a-z_][a-z0-9_]{0,30}" placeholder="rivomesh_sales"></label>
<label><span data-i18n="pgSlotPrefix"></span><input name="pgSlotPrefix" value="rivomesh" required disabled pattern="[a-z_][a-z0-9_]{0,30}"></label>
<label class="inline-check"><input name="pgFailoverSlot" type="checkbox" disabled><span data-i18n="pgFailoverSlot"></span></label>
<label class="inline-check"><input name="pgSecondaryIndexes" type="checkbox" disabled><span data-i18n="pgSecondaryIndexes"></span></label>
</div>
<div class="hidden" data-wizard-source="ORACLE">
<div class="form-grid">
<label><span data-i18n="oraclePdb"></span><input name="oraclePdb" required disabled pattern="[A-Z][A-Z0-9_]{0,127}" placeholder="FREEPDB1"></label>
<label><span data-i18n="sourceExpectedVersion"></span><input name="oracleVersion" disabled pattern="23[.]26([.][0-9]+[.][0-9]+[.][0-9]+)?" placeholder="23.26"></label>
</div>
<fieldset><legend data-i18n="oracleRootService"></legend><div class="form-grid">
<label><span data-i18n="sourceJdbc"></span><input name="oracleRootUrl" required disabled placeholder="jdbc:oracle:thin:@//source:1521/FREE"></label>
<label><span data-i18n="username"></span><input name="oracleRootUser" required disabled autocomplete="off"></label>
<label><span data-i18n="password"></span><input name="oracleRootPassword" type="password" disabled autocomplete="new-password"></label>
</div></fieldset>
<fieldset><legend data-i18n="oraclePdbService"></legend><div class="form-grid">
<label><span data-i18n="sourceJdbc"></span><input name="oraclePdbUrl" required disabled placeholder="jdbc:oracle:thin:@//source:1521/FREEPDB1"></label>
<label><span data-i18n="username"></span><input name="oraclePdbUser" required disabled autocomplete="off"></label>
<label><span data-i18n="password"></span><input name="oraclePdbPassword" type="password" disabled autocomplete="new-password"></label>
</div></fieldset>
<label><span data-i18n="oracleTables"></span><textarea name="oracleTables" required disabled rows="3" placeholder="APP.ORDERS&#10;APP.ORDER_ITEMS"></textarea></label>
<label><input type="checkbox" name="oracleVirtualNumeric" disabled> <span data-i18n="oracleVirtualNumeric"></span></label>
</div>
<p class="subtle" id="source-requirements" data-i18n="sourceRequirements"></p></section>
<section class="form-step hidden" id="step-1"><p class="subtle" data-i18n="targetHelp"></p><label class="v3-field"><span data-i18n="targetId"></span><input name="targetId" required value="target-1" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,127}"></label><label><span data-i18n="targetType"></span><select name="targetType"><option value="GAUSS">openGauss / GaussDB</option><option value="POSTGRESQL">PostgreSQL</option><option value="MYSQL">MySQL</option><option value="OCEANBASE">OceanBase (MySQL)</option><option value="GBASE_8C">GBase 8c (PG)</option><option value="KINGBASE">KingbaseES (PG)</option><option value="DM">DM8 / 达梦</option><option value="RABBITMQ">RabbitMQ</option><option value="NATS_JETSTREAM">NATS JetStream</option><option value="KAFKA">Kafka</option><option value="REDIS_STREAMS">Redis Streams</option><option value="PULSAR">Pulsar</option><option value="ROCKETMQ">RocketMQ</option><option value="ACTIVEMQ_CLASSIC">ActiveMQ Classic</option><option value="ACTIVEMQ_ARTEMIS">Artemis</option><option value="CLICKHOUSE">ClickHouse</option><option value="DORIS">Apache Doris</option><option value="HIVE">Apache Hive</option></select></label><label><span data-i18n="jdbcUrl"></span><input name="targetUrl" required value="jdbc:postgresql://127.0.0.1:8000/gaussdb?prepareThreshold=0&amp;connectTimeout=10&amp;socketTimeout=30"></label><div class="form-grid"><label><span data-i18n="targetSchema"></span><span id="primary-map-source" class="subtle"></span><input name="targetSchema" required placeholder="business"></label><label><span data-i18n="metadataSchema"></span><input name="metadataSchema" required value="sync_meta"></label><label><span data-i18n="username"></span><input name="targetUsername" required autocomplete="off"></label><label><span data-i18n="password"></span><input name="targetPassword" type="password" autocomplete="new-password"></label></div><div id="primary-messaging" class="messaging-settings hidden"></div><div id="first-extra-mappings" class="form-grid v3-field"></div><div id="extra-targets" class="v3-field"></div><button type="button" id="add-target" class="quiet v3-field" data-i18n="addTarget"></button><section class="v3-field journal-settings"><h3 data-i18n="journal"></h3><label><span data-i18n="journalMode"></span><select name="journalMode"><option value="LOCAL" data-i18n="journalLocal"></option><option value="EXTERNAL" data-i18n="journalExternal"></option></select></label><p class="subtle" data-i18n="journalHelp"></p><label><span data-i18n="journalQuota"></span><input name="journalMaxMiB" type="number" min="16" max="1073741824" value="1024" required></label><div id="external-journal" class="hidden"><label><span data-i18n="targetType"></span><select name="journalProduct"><option value="POSTGRESQL">PostgreSQL</option><option value="GAUSS">openGauss / GaussDB</option><option value="MYSQL">MySQL</option></select></label><label>JDBC URL<input name="journalUrl" placeholder="jdbc:postgresql://journal:5432/rivomesh" required disabled></label><div class="form-grid"><label><span data-i18n="username"></span><input name="journalUsername" required disabled autocomplete="off"></label><label><span data-i18n="password"></span><input name="journalPassword" type="password" disabled autocomplete="new-password"></label><label><span data-i18n="metadataSchema"></span><input name="journalNamespace" value="rivomesh_journal" required disabled></label></div></div></section><p class="subtle" data-i18n="passwordHelp"></p></section>
<section class="form-step hidden" id="step-2"><p class="subtle" data-i18n="planHelp"></p><pre id="plan-preview"></pre><div class="callout" data-i18n="currentLimit"></div></section><p id="create-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="previous-step" class="quiet" data-i18n="previous"></button><button type="button" id="next-step" class="primary" data-i18n="next"></button><button type="submit" id="save-task" class="primary hidden" data-i18n="saveTask"></button></div></form></dialog>

<dialog id="configuration-dialog"><form id="configuration-form">
<div class="dialog-heading"><div><span class="eyebrow">CONFIGURATION REVISIONS</span><h2 id="configuration-title"></h2></div><button type="button" id="configuration-close" class="quiet" aria-label="Close configuration">×</button></div>
<p class="subtle" data-config-i18n="configurationHelp"></p><p id="configuration-state" class="callout"></p><fieldset id="configuration-controls">
<div id="configuration-fields" class="form-grid"></div><details id="configuration-advanced"><summary data-config-i18n="advancedConfiguration"></summary><p class="subtle" data-config-i18n="advancedConfigurationHelp"></p><textarea id="configuration-document" rows="16" spellcheck="false" aria-label="Configuration JSON"></textarea></details>
<p id="configuration-error" class="error" role="alert"></p><div id="configuration-preview" class="callout hidden" role="status"></div>
<div class="detail-actions"><button type="button" id="configuration-reload" class="quiet" data-config-i18n="reloadConfiguration"></button><button type="button" id="configuration-check" data-config-i18n="previewConfiguration"></button><button type="submit" id="configuration-save" class="primary" disabled data-config-i18n="saveConfiguration"></button></div>
<h3 data-config-i18n="configurationHistory"></h3><div id="configuration-history"></div><button type="button" id="configuration-more" class="quiet hidden" data-config-i18n="moreVersions"></button></fieldset>
</form></dialog>
<dialog id="audit-dialog"><div class="dialog-heading"><div><span class="eyebrow">SECURITY EVENTS</span><h2 data-audit-i18n="auditTitle"></h2></div><button type="button" id="audit-close" class="quiet" aria-label="Close audit">×</button></div><p class="subtle" data-audit-i18n="auditHelp"></p><p id="audit-window" class="callout"></p><p id="audit-error" class="error" role="alert"></p><div class="detail-actions"><button id="audit-reload" type="button" data-audit-i18n="auditReload"></button><button id="audit-export" type="button" data-audit-i18n="auditExport" disabled></button><button id="audit-next" type="button" data-audit-i18n="auditNext" disabled></button></div><div id="audit-events" class="audit-events"></div><details><summary data-audit-i18n="auditProof"></summary><pre id="audit-proof"></pre></details></dialog>
<dialog id="accounts-dialog">
<div class="dialog-heading"><div><span class="eyebrow">IDENTITY DIRECTORY</span><h2 data-accounts-i18n="accountsTitle"></h2></div><button type="button" id="accounts-close" class="quiet" aria-label="Close accounts">×</button></div>
<p class="subtle" data-accounts-i18n="accountsHelp"></p><p id="accounts-mode" class="callout"></p>
<div class="detail-actions"><button id="accounts-reload" type="button" data-accounts-i18n="accountsReload"></button><button id="accounts-new" type="button" data-accounts-i18n="accountsNew"></button></div>
<section id="accounts-activation" class="hidden"><label><input id="accounts-activation-ack" type="checkbox"><span data-accounts-i18n="accountsActivateAck"></span></label><button id="accounts-activate" type="button" data-accounts-i18n="accountsActivate"></button></section>
<div id="accounts-list"></div><p id="accounts-error" class="error" role="alert"></p>
<form id="account-form" class="hidden" novalidate><fieldset id="account-fields">
<h3 id="account-edit-title"></h3><div class="form-grid"><label><span data-accounts-i18n="accountId"></span><input id="account-id" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" maxlength="64"></label><label><span data-accounts-i18n="accountRole"></span><select id="account-role"><option value="VIEWER">VIEWER</option><option value="OPERATOR">OPERATOR</option><option value="ADMIN">ADMIN</option></select></label></div>
<label><input id="account-enabled" type="checkbox" checked><span data-accounts-i18n="accountEnabled"></span></label>
<section id="account-grants"><label><span data-accounts-i18n="accountScope"></span><select id="account-scope"><option value="SELECTED" data-accounts-i18n="accountSelected"></option><option value="ALL" data-accounts-i18n="accountAll"></option></select></label><div id="account-task-options" class="account-grants"></div><label id="account-extra-label"><span data-accounts-i18n="accountExtraTasks"></span><textarea id="account-extra-tasks" rows="3"></textarea></label><p class="subtle" data-accounts-i18n="accountScopeHelp"></p></section>
<section id="account-node-grants" class="hidden"><label><span data-accounts-i18n="accountNodeScope"></span><select id="account-node-scope"><option value="SELECTED" data-accounts-i18n="accountSelectedNodes"></option><option value="ALL" data-accounts-i18n="accountAllNodes"></option></select></label><label id="account-node-list-label"><span data-accounts-i18n="accountNodeIds"></span><textarea id="account-node-ids" rows="3"></textarea></label><p class="subtle" data-accounts-i18n="accountNodeHelp"></p></section>
<section id="account-token-section"><label><span data-accounts-i18n="accountNewToken"></span><input id="account-token" type="password" autocomplete="new-password" minlength="32" maxlength="4096"></label><div class="detail-actions"><button id="account-generate" type="button" data-accounts-i18n="accountGenerate"></button><button id="account-show-token" type="button" data-accounts-i18n="accountShowToken"></button></div><p class="subtle" data-accounts-i18n="accountTokenHelp"></p><label><input id="account-token-saved" type="checkbox"><span data-accounts-i18n="accountTokenSaved"></span></label></section>
<section id="account-external-bind" class="hidden">
<label><span data-accounts-i18n="accountExternalIssuer"></span><input id="account-external-issuer" readonly></label>
<label><span data-accounts-i18n="accountExternalSubject"></span><input id="account-external-subject" type="password" autocomplete="off" maxlength="255" aria-describedby="account-external-bind-help"></label>
<p id="account-external-bind-help" class="subtle" data-accounts-i18n="accountExternalBindHelp"></p>
</section>
<p id="account-external-revoke" class="callout hidden" data-accounts-i18n="accountExternalRevokeHelp"></p>
<p id="account-delete-help" class="callout hidden" data-accounts-i18n="accountDeleteHelp"></p><pre id="account-preview"></pre><p id="account-error" class="error" role="alert"></p><div class="detail-actions"><button id="account-cancel" type="button" data-accounts-i18n="accountCancel"></button><button id="account-save" type="submit" class="primary" data-accounts-i18n="accountSave"></button></div>
</fieldset></form></dialog>
</body></html>
