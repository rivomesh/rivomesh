services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Sync@Test123
      MYSQL_ROOT_HOST: "%"
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_DB: sync_test
      POSTGRES_USER: sync_test
      POSTGRES_PASSWORD: Sync@Test123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /project
    environment:
      RIVOMESH_TEST_PREBUILT: ${RIVOMESH_TEST_PREBUILT:-0}
      MAVEN_OPTS: -Xmx768m
      RIVOMESH_CONFIGURATION_DIR: /project/target/broker-tests/${RIVOMESH_TEST_PROJECT:-configuration-manual}/acceptance
      JAVA_TOOL_OPTIONS: -Djava.util.logging.config.file=/project/tests/logging.properties
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
    depends_on:
      mysql: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  maven-cache:
