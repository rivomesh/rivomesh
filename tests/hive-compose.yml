services:
  init:
    image: apache/hive:4.0.1
    user: root
    volumes:
      - hive-meta:/opt/hive/rivomesh-meta
      - hive-data:/opt/hive/data/warehouse
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    entrypoint: ["bash", "-euc"]
    command: ["chown -R hive:hive /opt/hive/rivomesh-meta /opt/hive/data/warehouse; su hive -s /bin/bash -c 'schematool -dbType derby -info || schematool -dbType derby -initSchema'"]
  hive:
    image: apache/hive:4.0.1
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HADOOP_HEAPSIZE: "1536"
      HADOOP_CLIENT_OPTS: "-Xmx1536m"
      HIVESERVER2_PID_DIR: /run/rivomesh-hive
    tmpfs:
      - /run/rivomesh-hive:rw,nosuid,nodev,noexec,size=64k,mode=1777
    mem_limit: 5g
    cpus: 3
    volumes:
      - hive-meta:/opt/hive/rivomesh-meta
      - hive-data:/opt/hive/data/warehouse
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "beeline --silent=true -u 'jdbc:hive2://127.0.0.1:10000/default;auth=noSasl' -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 45
    stop_grace_period: 30s
  store:
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - hive-meta:/metadata
      - hive-data:/warehouse
      - hive-backup:/backup
    entrypoint: ["bash", "-euc"]
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: "Sync@Test123", MYSQL_ROOT_HOST: "%"}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment: {POSTGRES_DB: sync_test, POSTGRES_USER: sync_test, POSTGRES_PASSWORD: "Sync@Test123"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /project
    environment:
      RIVOMESH_HIVE_DIR: ${RIVOMESH_HIVE_DIR:-/project/target/hive-manual}
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
volumes:
  hive-backup:
  hive-meta:
  hive-data:
  maven-cache:
