services:
  dm:
    image: ${RIVOMESH_DM_IMAGE:-dm8:dm8_20250924_rev288894_HWarm_kylin10_64}
    entrypoint: ["/bin/bash", "/fixture/start.sh"]
    mem_limit: 2g
    cpus: 2
    environment:
      SYSDBA_PWD: Sync@Test123
      SYSAUDITOR_PWD: Sync@Test123
      SYSSSO_PWD: Sync@Test123
      UNICODE_FLAG: 1
      CASE_SENSITIVE: 1
      BLANK_PAD_MODE: 1
      PAGE_SIZE: 32
      BUFFER: 128
      TIME_ZONE: +00:00
    volumes:
      - dm-data:/opt/dmdbms/data
      - ./dm/health.sh:/fixture/health.sh:ro
      - ./dm/start.sh:/fixture/start.sh:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "/fixture/health.sh"]
      interval: 3s
      timeout: 5s
      retries: 90
    stop_grace_period: 60s
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: "Sync@Test123", MYSQL_ROOT_HOST: "%"}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment: {POSTGRES_DB: sync_test, POSTGRES_USER: sync_test, POSTGRES_PASSWORD: "Sync@Test123"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /project
    environment:
      MAVEN_OPTS: -Xmx768m
      RIVOMESH_DM_DIR: ${RIVOMESH_DM_DIR:-/project/target/dm-manual}
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
volumes:
  dm-data:
  maven-cache:
