services:
  mysql:
    image: ${SYNC_MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: Sync@Test123
      MYSQL_ROOT_HOST: "%"
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60
  gaussdb:
    image: ${SYNC_GAUSSDB_IMAGE:-opengauss/opengauss-server:latest}
    shm_size: 512mb
    environment:
      GS_PASSWORD: Sync@Test123
      GS_DB: sync_test
      GS_USERNAME: sync_test
      GS_HOST_AUTH_METHOD: sha256
      OTHER_PG_CONF: password_encryption_type = 2
    healthcheck:
      test: ["CMD-SHELL", "su - omm -c 'gsql -d sync_test -c \"SELECT 1\"' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /project
    environment:
      JAVA_TOOL_OPTIONS: -Djava.util.logging.config.file=/project/tests/logging.properties
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
    depends_on:
      mysql:
        condition: service_healthy
      gaussdb:
        condition: service_healthy
    command: ["mvn", "-B", "-s", "build/settings.xml", "-Dsync.integration=true", "-DtestSuite=integration", "-Dtest=ConversionTest,FailoverRulesTest,PlatformTest,JournalTest,JournalIntegrationTest,JdbcSinkTest,NormalizationTest,FanoutDispatcherTest,JdbcSinkIntegrationTest,JsonValuesTest,TargetStoreIntegrationTest,SyncIntegrationTest,PlatformIntegrationTest,JsonIntegrationTest,MysqlCdcSourceIntegrationTest", "-Dsurefire.failIfNoSpecifiedTests=false", "verify"]
volumes:
  maven-cache:
