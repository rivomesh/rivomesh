services:
  gbase8c:
    image: rivomesh-gbase8c-fixture:V6_S1.3.0B19
    mem_limit: 2g
    cpus: 2
    environment: {DB_PASSWORD: "Sync@Test123"}
    volumes:
      - ./gbase8c/start.sh:/fixture/start.sh:ro
      - ./gbase8c/health.sh:/fixture/health.sh:ro
      - gbase-data:/var/lib/gbase8c
    healthcheck:
      test: ["CMD", "/bin/bash", "/fixture/health.sh"]
      interval: 3s
      timeout: 5s
      retries: 90
    stop_signal: SIGINT
    stop_grace_period: 60s
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: "Sync@Test123", MYSQL_ROOT_HOST: "%"}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment: {POSTGRES_DB: sync_test, POSTGRES_USER: sync_test, POSTGRES_PASSWORD: "Sync@Test123"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /project
    environment:
      MAVEN_OPTS: -Xmx768m
      JAVA_TOOL_OPTIONS: -Djava.util.logging.config.file=/project/tests/logging.properties
      RIVOMESH_GBASE8C_DIR: ${RIVOMESH_GBASE8C_DIR:-/project/target/gbase8c-manual}
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
volumes:
  gbase-data:
  maven-cache:
