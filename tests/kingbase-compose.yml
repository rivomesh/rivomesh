services:
  kingbase:
    image: ${RIVOMESH_KINGBASE_IMAGE:-kingbase_v009r001c001b0025_single_arm:v1}
    mem_limit: 1500m
    cpus: 2
    environment: {DB_PASSWORD: "Sync@Test123"}
    entrypoint: ["/bin/bash", "/fixture/start.sh"]
    volumes:
      - ./kingbase/start.sh:/fixture/start.sh:ro
      - kb-data:/home/kingbase/userdata
    healthcheck:
      test: ["CMD-SHELL", "/home/kingbase/install/kingbase/bin/ksql -U system -d test -p 54321 -Atc 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60
    stop_signal: SIGINT
    stop_grace_period: 30s
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: "Sync@Test123", MYSQL_ROOT_HOST: "%"}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment: {POSTGRES_DB: sync_test, POSTGRES_USER: sync_test, POSTGRES_PASSWORD: "Sync@Test123"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-8
    working_dir: /project
    environment:
      MAVEN_OPTS: -Xmx768m
      RIVOMESH_KB_DIR: ${RIVOMESH_KB_DIR:-/project/target/kingbase-manual}
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
volumes:
  kb-data:
  maven-cache:
