services:
  doris:
    image: apache/doris:all-in-one-4.1.3
    mem_limit: 6g
    cpus: 3
    environment:
      FE_HEAP: 768m
      BE_HEAP: 256m
      BE_CONFIG_EXTRA: "mem_limit = 2g"
    volumes:
      - fe-meta:/opt/apache-doris/fe/doris-meta
      - be-storage:/opt/apache-doris/be/storage
    stop_grace_period: 60s
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: "Sync@Test123", MYSQL_ROOT_HOST: "%"}
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-transaction-compression=OFF", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-replica-updates=ON"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD='Sync@Test123' mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.12
    environment: {POSTGRES_DB: sync_test, POSTGRES_USER: sync_test, POSTGRES_PASSWORD: "Sync@Test123"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_test -d sync_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  tests:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /project
    environment:
      MAVEN_OPTS: -Xmx768m
      RIVOMESH_TEST_PROJECT: ${RIVOMESH_TEST_PROJECT:-doris-manual}
      RIVOMESH_TEST_PREBUILT: ${RIVOMESH_TEST_PREBUILT:-0}
      RIVOMESH_DORIS_DIR: ${RIVOMESH_DORIS_DIR:-/project/target/broker-tests/doris-manual}
    volumes:
      - ..:/project
      - ${SYNC_MAVEN_CACHE:-maven-cache}:/root/.m2/repository
  store:
    image: maven:3.9-eclipse-temurin-21
    volumes:
      - fe-meta:/fe
      - be-storage:/be
      - backup:/backup
    entrypoint: ["bash", "-euc"]
volumes:
  backup:
  fe-meta:
  be-storage:
  maven-cache:
