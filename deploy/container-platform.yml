bind: 0.0.0.0
port: 8080
authToken: ${RIVOMESH_TOKEN}
tasksDirectory: /app/data/tasks
dataDirectory: /app/data/controller
maxTasks: 20
maxRunningTasks: 2
workerHeapMiB: 256
controlThreads: 4
pollMillis: 3000
autoStart: false

# Logical audit retention; protect/monitor the persistent data directory.
auditMaxEvents: 1000000

# Local HTTP preview only. Use secureCookie: true behind production HTTPS.
sessions:
  secureCookie: false
