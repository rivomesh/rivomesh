bind: 0.0.0.0
port: 8080
users:
  - id: admin
    role: ADMIN
    token: ${RIVOMESH_PREVIEW_TOKEN}
tasksDirectory: /app/data/tasks
dataDirectory: /app/data/controller
maxTasks: 100
maxRunningTasks: 2
workerHeapMiB: 256
controlThreads: 4
pollMillis: 3000
autoStart: false
auditMaxEvents: 100000

# Local HTTP preview only. Use secureCookie: true behind production HTTPS.
sessions:
  secureCookie: false

# Shared node registry and identity; task execution authority remains local.
cluster:
  sharedAccess: true
  id: development-preview
  nodeId: ${RIVOMESH_NODE_ID}
  driver: org.postgresql.Driver
  url: jdbc:postgresql://control-store:5432/rivomesh_control
  username: rivomesh
  password: ${RIVOMESH_CONTROL_PASSWORD}
  advertiseUrl: ${RIVOMESH_NODE_URL}
