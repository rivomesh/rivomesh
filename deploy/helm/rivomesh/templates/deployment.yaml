apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        {{- if not .Values.cluster.handoffEvidenceClaim }}
        fsGroup: 10001
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rivomesh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [serve, /app/config/platform.yml]
          env:
            {{- if .Values.auth.legacyTokenEnabled }}
            - name: RIVOMESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.key }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: RIVOMESH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "oidc.existingSecret is required" .Values.oidc.existingSecret | quote }}
                  key: {{ required "oidc.clientSecretKey is required" .Values.oidc.clientSecretKey | quote }}
            {{- end }}
            {{- range $index, $user := .Values.auth.users }}
            - name: RIVOMESH_USER_TOKEN_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.secretRef.name | quote }}
                  key: {{ $user.secretRef.key | quote }}
            {{- end }}
            {{- if .Values.cluster.enabled }}
            - name: RIVOMESH_NODE_ID
              value: {{ default .Release.Name .Values.cluster.nodeId | quote }}
            - name: RIVOMESH_CONTROL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.existingSecret | quote }}
                  key: {{ .Values.cluster.usernameKey | quote }}
            - name: RIVOMESH_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.existingSecret | quote }}
                  key: {{ .Values.cluster.passwordKey | quote }}
            {{- if .Values.cluster.sharedTasks }}
            - name: RIVOMESH_TASK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cluster.existingSecret | quote }}
                  key: {{ .Values.cluster.taskKeyKey | quote }}
            {{- end }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx{{ .Values.controllerHeapMiB }}m
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.cluster.handoffEvidenceClaim }}
            - {name: handoff-evidence, mountPath: /app/handoff-evidence}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" .Release.Name) .Values.persistence.existingClaim }}
        {{- if .Values.cluster.handoffEvidenceClaim }}
        - name: handoff-evidence
          persistentVolumeClaim:
            claimName: {{ .Values.cluster.handoffEvidenceClaim | quote }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
